version: '3.9'
services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vms
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/vms
      JWT_SECRET: changeme
    depends_on:
      - postgres
    ports:
      - '4000:4000'
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    depends_on:
      - server
    ports:
      - '5173:5173'
volumes:
  postgres_data:
